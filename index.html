<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remind me</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1448B8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4FF;--card:#fff;--ink:#0A2150;--mute:#5F78A3;--blue:#1448B8;--bright:#2F7BFF;--sky:#DCE9FF;--line:#D3E2FC;--ok:#138A57;--err:#FFD3D3}
@media(prefers-color-scheme:dark){:root{--bg:#06122A;--card:#0D2147;--ink:#E8F1FF;--mute:#8CA6D4;--blue:#2F7BFF;--bright:#6AA2FF;--sky:#15305E;--line:#1C376A;--ok:#4FD39A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Sora,"Segoe UI",system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px max(90px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 4px 18px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center}
.top h1{font-size:22px;margin:0;letter-spacing:-.4px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px 2px}
input{width:100%;font:inherit;color:var(--ink);border:0;outline:0}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
#what{background:var(--bg);border-radius:14px;padding:15px 16px;font-size:17px;border:2px solid transparent}
#what:focus{border-color:var(--bright)}
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:22px 18px 18px;margin-bottom:12px}
.hero label{color:rgba(255,255,255,.7);text-align:center}
#time{color:#fff;background:transparent;text-align:center;font-size:76px;font-weight:700;letter-spacing:-2px;line-height:1;padding:2px 0 4px;caret-color:#fff}
::placeholder{color:rgba(255,255,255,.3);opacity:1}
#what::placeholder{color:var(--mute);opacity:.7}
.sep{height:1px;background:rgba(255,255,255,.18);margin:20px -4px}
.drow{display:flex;gap:10px;align-items:flex-end}
.drow>div:first-child{flex:1.1}
#date,#pre{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:13px 14px;font-size:18px;font-weight:600;text-align:center;border:2px solid transparent}
#date:focus,#pre:focus,#time:focus{border-color:rgba(255,255,255,.55)}
#time:focus{border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chip{font:inherit;font-size:13.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:10px 15px;cursor:pointer;transition:background .15s,color .15s}
.chip.on{background:#fff;color:var(--blue)}
.chip:active{transform:scale(.97)}
.quick{margin-top:14px}
.quick .chip{padding:9px 14px;font-size:13px;background:transparent;border:1.5px solid rgba(255,255,255,.3)}
.add{width:100%;margin-top:24px;font:inherit;font-size:17px;font-weight:700;color:var(--blue);background:#fff;border:0;border-radius:16px;padding:17px;cursor:pointer;transition:transform .1s}
.add:active{transform:scale(.98)}
.err{min-height:20px;margin:10px 2px 0;font-size:13.5px;color:var(--err);text-align:center}
h2{font-size:14px;margin:26px 4px 10px;color:var(--mute);font-weight:600}
html{scroll-behavior:smooth}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:8px}
.when{min-width:66px;text-align:center}
.when b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--blue);line-height:1.1}
.when small{font-size:12px;color:var(--mute)}
.body{flex:1;min-width:0}
.body b{display:block;font-weight:600;word-break:break-word}
.body small{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-top:2px}
.body small svg{flex:none}
.item.due .body small{color:inherit}
.acts{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.cancel{display:block;width:100%;font:inherit;font-size:14px;font-weight:600;color:#fff;background:transparent;border:0 solid rgba(255,255,255,.3);border-radius:16px;cursor:pointer;overflow:hidden;max-height:0;opacity:0;margin-top:0;padding:0 13px;visibility:hidden;transition:max-height .3s ease,opacity .25s ease,margin .3s ease,padding .3s ease,border-width .3s ease,visibility 0s .3s}
.cancel.show{max-height:60px;opacity:1;margin-top:10px;padding:13px;border-width:1.5px;visibility:visible;transition-delay:0s}
.del{font:inherit;font-size:13px;font-weight:600;color:var(--blue);background:var(--sky);border:0;border-radius:12px;padding:9px 12px;cursor:pointer;transition:transform .12s,opacity .15s}
.del:active{transform:scale(.95)}
.item.due{background:var(--blue);color:#fff}
.item.due .when b,.item.due .body small,.item.due .when small{color:#fff}
.item.due .body small{opacity:.85}
.item.due .del{background:#fff;color:var(--blue)}
.dot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.item.done{background:transparent;padding:8px 16px;margin-bottom:2px}
.item.done .when b{font-size:16px;color:var(--mute)}
.item.done .body b{text-decoration:line-through;color:var(--mute);font-weight:400}
.item.done .body small{color:var(--ok)}
.empty{text-align:center;padding:26px 10px;color:var(--mute);font-size:14px}
.empty svg{display:block;margin:0 auto 10px}
.clr{width:100%;font:inherit;font-size:13px;font-weight:600;color:var(--mute);background:transparent;border:0;padding:12px;cursor:pointer}
.banner{background:var(--sky);border-radius:20px;padding:16px;margin-bottom:12px;font-size:14px}
.banner button{margin-top:10px;font:inherit;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin-top:22px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.tabs{position:relative;display:flex;background:rgba(255,255,255,.14);border-radius:999px;padding:4px;margin-bottom:16px}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:999px;transition:transform .35s cubic-bezier(.4,0,.2,1)}
.tabs[data-mode="rep"] .pill{transform:translateX(100%)}
.tab{flex:1;font:inherit;font-size:13.5px;font-weight:600;color:#fff;background:transparent;border:0;border-radius:999px;padding:9px 12px;cursor:pointer;position:relative;z-index:1;transition:color .3s ease}
.tab.on{color:var(--blue)}
.hero .chk{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;accent-color:#fff;cursor:pointer}
.days{flex-wrap:nowrap;gap:6px}
.days .chip{flex:1;min-width:0;padding:10px 0;font-size:13px;text-align:center}
.chip:disabled{opacity:.55;cursor:default}
.undo{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,160px);width:min(440px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:16px;overflow:hidden;z-index:5;visibility:hidden;transition:transform .3s,visibility 0s .3s}
.undo.show{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.u-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 16px 18px;font-size:14px;font-weight:600}
.u-row button{font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);background:var(--bg);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.u-bar{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--bright);transform-origin:left center}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}

/* płynne panele (Jednorazowo / Powtarzaj) */
.pnl{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .35s ease,opacity .3s ease,visibility 0s}
.pnl>.in{min-height:0;overflow:hidden}
.pnl.off{grid-template-rows:0fr;opacity:0;visibility:hidden;pointer-events:none;transition:grid-template-rows .35s ease,opacity .2s ease,visibility 0s .35s}
/* pojawianie się kafelka */
.item.enter{overflow:hidden;animation:enter .4s ease both}
@keyframes enter{from{opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;transform:translateY(-10px) scale(.97)}to{opacity:1;max-height:180px;margin-bottom:8px;padding-top:14px;padding-bottom:14px;transform:none}}
.item.done.enter{animation-name:enterd}
@keyframes enterd{from{opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0}to{opacity:1;max-height:120px;margin-bottom:2px;padding-top:8px;padding-bottom:8px}}
.banner{animation:fadeup .4s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.empty{animation:fadeup .4s ease both}
@media(prefers-reduced-motion:reduce){.pill{transition:none}.pnl,.pnl.off,.cancel,.item.enter,.banner,.empty{transition:none;animation:none}html{scroll-behavior:auto}}
#splash{position:fixed;inset:0;z-index:100;background:#1448B8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s ease,visibility 0s .45s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash svg{width:132px;height:132px;overflow:visible}
#splash .sw{transform-origin:12px 3px;animation:ring 1.6s ease-in-out infinite}
#splash .cl{transform-origin:12px 3px;animation:clap 1.6s ease-in-out infinite}
#splash b{color:#fff;font-size:22px;font-weight:700;letter-spacing:-.3px;opacity:0;animation:fin .6s .25s ease forwards}
#splash i{display:block;width:44px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;position:relative;font-style:normal}
#splash i::after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:#fff;animation:slide 1.1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}75%{transform:rotate(2deg)}}
@keyframes clap{0%,100%{transform:rotate(0)}15%{transform:rotate(-20deg)}30%{transform:rotate(18deg)}45%{transform:rotate(-12deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-3deg)}}
@keyframes fin{to{opacity:1}}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media(prefers-reduced-motion:reduce){#splash .sw,#splash .cl,#splash i::after{animation:none}}
</style></head><body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path class="sw" d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path class="cl" d="M10.3 21a1.9 1.9 0 003.4 0"/></svg><b>Remind me</b><i></i></div>
<main>
<div class="top"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg></div><h1>Remind me</h1></div>
<div id="perm"></div>

<div class="card">
  <label for="what">Co ci przypomnieć?</label>
  <input id="what" maxlength="120" placeholder="np. Wziąć tabletki" autocomplete="off">
</div>

<section class="hero">
  <div class="sec">
    <label for="time">Godzina</label>
    <input id="time" inputmode="numeric" placeholder="--:--" autocomplete="off" aria-label="Godzina, np. 14:30">
    <div class="chips"><button class="chip" data-m="15">za 15 min</button><button class="chip" data-m="60">za 1 godz.</button><button class="chip" data-m="180">za 3 godz.</button></div>
  </div>
  <div class="sep"></div>
  <div class="sec">
    <div class="tabs" data-mode="once" role="tablist" aria-label="Rodzaj przypomnienia"><i class="pill"></i>
      <button type="button" class="tab on" id="tab-once" role="tab" aria-selected="true" aria-controls="p-once">Jednorazowo</button>
      <button type="button" class="tab" id="tab-rep" role="tab" aria-selected="false" aria-controls="p-rep">Powtarzaj</button>
    </div>
    <div id="p-once" class="pnl" role="tabpanel" aria-labelledby="tab-once"><div class="in">
      <label for="date">Data</label>
      <input id="date" inputmode="numeric" placeholder="DD.MM.RRRR" autocomplete="off">
      <div class="chips"><button class="chip" data-d="0">Dziś</button><button class="chip" data-d="1">Jutro</button></div>
    </div></div>
    <div id="p-rep" class="pnl off" role="tabpanel" aria-labelledby="tab-rep" aria-hidden="true"><div class="in">
      <label class="chk"><input type="checkbox" id="daily"> Codziennie</label>
      <div class="chips days" id="days" aria-label="Dni tygodnia">
        <button type="button" class="chip" data-wd="1">Pn</button><button type="button" class="chip" data-wd="2">Wt</button><button type="button" class="chip" data-wd="3">Śr</button><button type="button" class="chip" data-wd="4">Cz</button><button type="button" class="chip" data-wd="5">Pt</button><button type="button" class="chip" data-wd="6">Sb</button><button type="button" class="chip" data-wd="0">Nd</button>
      </div>
    </div></div>
  </div>
  <div class="sep"></div>
  <div class="sec">
    <label for="pre">Przypomnij wcześniej (minut przed)</label>
    <input id="pre" inputmode="numeric" maxlength="4" placeholder="Brak" autocomplete="off">
    <div class="chips"><button class="chip" data-p="5">5 min</button><button class="chip" data-p="15">15 min</button><button class="chip" data-p="30">30 min</button><button class="chip" data-p="60">1 godz.</button></div>
  </div>
  <button class="add" id="add">Dodaj przypomnienie</button>
  <button class="cancel" id="cancel" type="button" tabindex="-1">Anuluj edycję</button>
  <div class="err" id="err" role="alert"></div>
</section>

<div id="list"></div>
</main>
<div class="toast" id="toast"></div>
<div class="undo" id="undo" role="status" aria-live="polite"><div class="u-row"><span>Usunięto przypomnienie</span><button type="button" id="undoBtn">Cofnij</button></div><i class="u-bar" id="undoBar"></i></div>
<script>
const ST='kv',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('remindme',1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){const d=await idb();return new Promise(res=>{const q=d.transaction(ST).objectStore(ST).get('list');q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
async function save(l){const d=await idb();return new Promise(res=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(l,'list');t.oncomplete=res})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dstr=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const tstr=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
function dayLabel(t){const n=new Date(),d=new Date(t),diff=Math.round((day0(d)-day0(n))/864e5);
  if(diff===0)return 'Dziś';if(diff===1)return 'Jutro';
  return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'})}
function rel(at){const m=Math.round((at-Date.now())/60000);
  if(m<1)return 'za chwilę';if(m<60)return `za ${m} min`;
  if(m<1440){const h=Math.floor(m/60),r=m%60;return `za ${h} godz.`+(r?` ${r} min`:'')}
  return dayLabel(at)}
// --- powtarzanie ---
const WN={1:'Pn',2:'Wt',3:'Śr',4:'Cz',5:'Pt',6:'Sb',0:'Nd'};
function repLabel(d){const o=[1,2,3,4,5,6,0].filter(x=>d.includes(x));
  if(o.length===7)return 'Codziennie';if(o.join()==='1,2,3,4,5')return 'Pn–Pt';return o.map(x=>WN[x]).join(', ')}
function nextAt(r,from){if(!r.days||!r.days.length)return null;
  const o=new Date(r.at),h=o.getHours(),m=o.getMinutes(),n=new Date(from||Date.now());
  for(let i=0;i<=8;i++){const d=new Date(n.getFullYear(),n.getMonth(),n.getDate()+i,h,m,0,0);
    if(r.days.includes(d.getDay())&&d.getTime()>n.getTime())return d.getTime()}
  return null}
function complete(r){const nx=nextAt(r);
  if(nx){r.at=nx;r.preShown=!!r.pre&&nx-r.pre*60000<=Date.now();return nx}
  r.done=true;r.doneAt=Date.now();return 0}
// --- cofnij usunięcie ---
const UNDO_MS=5000;let undoT=null,undoItem=null;
function hideUndo(){clearTimeout(undoT);undoItem=null;$('#undo').classList.remove('show')}
function showUndo(item){
  clearTimeout(undoT);undoItem=item;
  const bar=$('#undoBar');bar.style.animation='none';void bar.offsetWidth;bar.style.animation='drain '+UNDO_MS+'ms linear forwards';
  $('#undo').classList.add('show');undoT=setTimeout(hideUndo,UNDO_MS);
}
$('#undoBtn').onclick=async()=>{const it=undoItem;if(!it)return;hideUndo();
  const l=await load();if(!l.some(r=>r.id===it.id))l.push(it);await save(l);toast('Przywrócono');render();tick()};
// --- wpisywanie z palca ---
$('#time').addEventListener('input',e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,4);let o=v;
  if(v.length===3)o=(+v.slice(0,2)<=23?v.slice(0,2)+':'+v.slice(2):v[0]+':'+v.slice(1));
  if(v.length===4)o=v.slice(0,2)+':'+v.slice(2);
  e.target.value=o;
});
$('#time').addEventListener('blur',e=>{const v=e.target.value;if(/^\d{1,2}$/.test(v))e.target.value=v+':00'});
$('#date').addEventListener('input',e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,8);let o=v.slice(0,2);
  if(v.length>2)o+='.'+v.slice(2,4);if(v.length>4)o+='.'+v.slice(4);
  e.target.value=o;chips();
});
function parseTime(s){const m=s.match(/^(\d{1,2})(?::(\d{1,2}))?$/);if(!m)return null;const h=+m[1],mi=m[2]===undefined?0:+m[2];return h<24&&mi<60?[h,mi]:null}
function parseDate(s){const m=s.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?$/);if(!m)return null;
  const n=new Date();let y=m[3]?+m[3]:n.getFullYear();const d=+m[1],mo=+m[2];
  const chk=(yy)=>{const t=new Date(yy,mo-1,d);return t.getDate()===d&&t.getMonth()===mo-1?t:null};
  let t=chk(y);if(t&&!m[3]&&day0(t)<day0(n))t=chk(y+1);return t}
function chips(){const v=$('#date').value;
  document.querySelectorAll('[data-d]').forEach(b=>{const d=new Date();d.setDate(d.getDate()+ +b.dataset.d);b.classList.toggle('on',v===dstr(d))})}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=new Date();d.setDate(d.getDate()+ +b.dataset.d);$('#date').value=dstr(d);chips();$('#err').textContent=''});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const d=new Date(Date.now()+ +b.dataset.m*60000);$('#date').value=dstr(d);$('#time').value=tstr(d);chips();$('#err').textContent=''});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
$('#add').onclick=async()=>{
  const err=m=>{$('#err').textContent=m},text=$('#what').value.trim();
  if(!text)return err('Wpisz, co ci przypomnieć.');
  const tm=parseTime($('#time').value.trim());if(!tm)return err('Wpisz godzinę, np. 1430 albo 8:15.');
  let dt,at,days=null;
  if(mode==='rep'){
    days=[...rep].sort((a,b)=>a-b);
    if(!days.length)return err('Wybierz dni powtarzania albo zaznacz Codziennie.');
    dt=new Date();dt.setHours(tm[0],tm[1],0,0);at=nextAt({at:dt.getTime(),days});
  }else{
    dt=parseDate($('#date').value.trim());if(!dt)return err('Wpisz datę, np. 1210 albo 12.10.2026.');
    dt.setHours(tm[0],tm[1],0,0);at=dt.getTime();
    if(at<=Date.now())return err('Ta godzina już minęła. Wybierz późniejszą.');
  }
  const pre=parseInt($('#pre').value||'0',10)||0;
  if(pre>10080)return err('Uprzedzenie może być maksymalnie 10080 minut (tydzień) wcześniej.');
  const preLate=pre>0&&at-pre*60000<=Date.now();
  if(preLate&&!days)return err('Przypomnienie uprzedzające wypadłoby w przeszłości. Zmniejsz liczbę minut.');
  if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();
  const l=await load(),wasEdit=!!editId;
  const item={id:editId||crypto.randomUUID(),text,at,done:false,pre,preShown:preLate,...(days?{days}:{})};
  const ix=wasEdit?l.findIndex(x=>x.id===editId):-1;
  if(ix>=0)l[ix]=item;else l.push(item);
  await save(l);
  if(wasEdit){try{const reg=await navigator.serviceWorker.getRegistration();if(reg)(await reg.getNotifications()).filter(n=>n.data&&n.data.id===item.id).forEach(n=>n.close())}catch(e){}}
  resetForm();
  toast(`${wasEdit?'Zapisano':'Ustawione'}: ${(days?repLabel(days):dayLabel(at)).toLowerCase()}, ${tstr(dt)}`);perm();render();tick();
};
let editId=null;
function resetForm(){editId=null;$('#add').textContent='Dodaj przypomnienie';$('#cancel').classList.remove('show');$('#cancel').tabIndex=-1;
  $('#err').textContent='';$('#what').value='';$('#time').value='';$('#pre').value='';preChips();$('#date').value=dstr(new Date());chips();
  setMode('once');rep.clear();dayChips()}
$('#cancel').onclick=resetForm;
function startEdit(r){
  editId=r.id;const d=new Date(r.at);
  $('#what').value=r.text;$('#time').value=tstr(d);$('#pre').value=r.pre?String(r.pre):'';preChips();
  if(r.days&&r.days.length){setMode('rep');rep.clear();r.days.forEach(x=>rep.add(x));dayChips()}
  else{setMode('once');rep.clear();dayChips();$('#date').value=dstr(d);chips()}
  $('#add').textContent='Zapisz zmiany';$('#cancel').classList.add('show');$('#cancel').tabIndex=0;$('#err').textContent='';
  window.scrollTo({top:0,behavior:'smooth'});
}
function perm(){
  if(!('Notification' in window)){$('#perm').innerHTML='<div class="banner">Ta przeglądarka nie obsługuje powiadomień. Na iPhonie dodaj aplikację do ekranu początkowego.</div>';return}
  if(Notification.permission==='granted'){$('#perm').innerHTML='';return}
  $('#perm').innerHTML='<div class="banner">Żeby przypomnienia dochodziły, włącz powiadomienia.<br><button id="allow">Włącz powiadomienia</button></div>';
  $('#allow').onclick=async()=>{await Notification.requestPermission();perm()};
}
const repSm='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V10a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg>';
const bellSm='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg>';
const bell='<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg>';
const seen=new Set();let seenInit=false,leaving=false;
function leave(el){return new Promise(res=>{if(!el)return res();leaving=true;
  el.style.height=el.offsetHeight+'px';el.style.overflow='hidden';void el.offsetHeight;
  el.style.transition='height .32s ease,opacity .25s ease,margin .32s ease,padding .32s ease,transform .32s ease';
  el.style.height='0';el.style.opacity='0';el.style.marginBottom='0';el.style.paddingTop='0';el.style.paddingBottom='0';el.style.transform='translateX(28px)';
  setTimeout(()=>{leaving=false;res()},330)})}
async function render(){
  if(leaving)return;
  const l=(await load()).sort((a,b)=>a.at-b.at),now=Date.now();
  const act=l.filter(r=>!r.done),dn=l.filter(r=>r.done).sort((a,b)=>b.doneAt-a.doneAt);
  let h='<h2>Zaplanowane</h2>';
  h+=act.length?act.map(r=>{const due=r.at<=now,d=new Date(r.at);
    const k='a'+r.id,en=seenInit&&!seen.has(k);seen.add(k);
    return `<div class="item ${due?'due':''}${en?' enter':''}" data-id="${r.id}"><div class="when"><b>${tstr(d)}</b><small>${dayLabel(r.at)}</small></div><div class="body"><b>${esc(r.text)}</b>${due?'<small><span class="dot"></span>Wróci, dopóki nie klikniesz Zrobione</small>':'<small>'+rel(r.at)+'</small>'}${r.days?'<small>'+repSm+repLabel(r.days)+'</small>':''}${r.pre?'<small>'+bellSm+fmtMin(r.pre)+' wcześniej</small>':''}</div><div class="acts">${due?`<button class="del" data-done="${r.id}">Zrobione</button>`:`<button class="del" data-del="${r.id}">Usuń</button>`}<button class="del" data-edit="${r.id}">Edytuj</button></div></div>`}).join('')
  :`<div class="empty">${bell}Nic nie czeka. Dodaj pierwsze przypomnienie.</div>`;
  if(dn.length)h+='<h2>Zrobione</h2>'+dn.slice(0,8).map(r=>{const k='d'+r.id,en=seenInit&&!seen.has(k);seen.add(k);return `<div class="item done${en?' enter':''}"><div class="when"><b>${tstr(new Date(r.at))}</b></div><div class="body"><b>${esc(r.text)}</b><small>Zrobione ${tstr(new Date(r.doneAt))}</small></div></div>`}).join('')+'<button class="clr" id="clr">Wyczyść historię</button>';
  seenInit=true;
  $('#list').innerHTML=h;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const l=await load(),r=l.find(x=>x.id===b.dataset.del);if(!r)return;seen.delete('a'+r.id);await leave(b.closest('.item'));await save(l.filter(x=>x!==r));render();showUndo(r)});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{const id=b.dataset.done,l=await load(),r=l.find(x=>x.id===id);let nx=0;if(r){const el=b.closest('.item');nx=complete(r);if(r.done)await leave(el);await save(l)}
    try{const reg=await navigator.serviceWorker.getRegistration();if(reg)(await reg.getNotifications()).filter(n=>n.data&&n.data.id===id).forEach(n=>n.close())}catch(e){}if(nx)toast(`Następne: ${dayLabel(nx).toLowerCase()}, ${tstr(new Date(nx))}`);render()});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const r=(await load()).find(x=>x.id===b.dataset.edit);if(r)startEdit(r)});
  const c=$('#clr');if(c)c.onclick=async()=>{await save((await load()).filter(r=>!r.done));render()};
}
const fmtMin=m=>m<60?m+' min':(Math.floor(m/60)+' godz.'+(m%60?' '+(m%60)+' min':''));
function preChips(){const v=$('#pre').value;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',v===b.dataset.p))}
$('#pre').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);preChips()});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#pre').value=$('#pre').value===b.dataset.p?'':b.dataset.p;preChips();$('#err').textContent=''});
let mode='once';const rep=new Set();
function setMode(m){mode=m;$('.tabs').dataset.mode=m;
  [['once','#tab-once','#p-once'],['rep','#tab-rep','#p-rep']].forEach(([k,tb,pn])=>{
    $(tb).classList.toggle('on',m===k);$(tb).setAttribute('aria-selected',m===k);$(pn).classList.toggle('off',m!==k);$(pn).setAttribute('aria-hidden',m!==k)});
  $('#err').textContent=''}
function dayChips(){
  document.querySelectorAll('[data-wd]').forEach(b=>b.classList.toggle('on',rep.has(+b.dataset.wd)));
  $('#daily').checked=rep.size===7}
$('#tab-once').onclick=()=>setMode('once');$('#tab-rep').onclick=()=>setMode('rep');
$('#daily').onchange=()=>{rep.clear();if($('#daily').checked)for(let i=0;i<7;i++)rep.add(i);dayChips();$('#err').textContent=''};
document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{const w=+b.dataset.wd;rep.has(w)?rep.delete(w):rep.add(w);dayChips();$('#err').textContent=''});
const tick=()=>{if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'check'});render()};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(async r=>{await navigator.serviceWorker.ready;try{await r.periodicSync.register('check',{minInterval:60000})}catch(e){}});
  navigator.serviceWorker.addEventListener('message',render);
}
$('#date').value=dstr(new Date());chips();perm();render();setInterval(tick,5000);
document.addEventListener('visibilitychange',tick);
(()=>{const sp=$('#splash'),t0=performance.now();
  const hide=()=>{setTimeout(()=>{sp.classList.add('hide');setTimeout(()=>sp.remove(),600)},Math.max(0,1100-(performance.now()-t0)))};
  Promise.race([document.fonts?document.fonts.ready:0,new Promise(r=>setTimeout(r,2500))]).then(hide)})();
</script></body></html>
