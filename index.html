<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remind me</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1448B8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4FF;--card:#fff;--ink:#0A2150;--mute:#5F78A3;--blue:#1448B8;--bright:#2F7BFF;--sky:#DCE9FF;--line:#D3E2FC;--ok:#138A57;--err:#FFD3D3}
@media(prefers-color-scheme:dark){:root{--bg:#06122A;--card:#0D2147;--ink:#E8F1FF;--mute:#8CA6D4;--blue:#2F7BFF;--bright:#6AA2FF;--sky:#15305E;--line:#1C376A;--ok:#4FD39A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Sora,"Segoe UI",system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px max(90px,env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin:4px 4px 18px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center}
.top h1{font-size:22px;margin:0;letter-spacing:-.4px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px 2px}
input{width:100%;font:inherit;color:var(--ink);border:0;outline:0}
.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
#what{background:var(--bg);border-radius:14px;padding:15px 16px;font-size:17px;border:2px solid transparent}
#what:focus{border-color:var(--bright)}
.hero{background:var(--blue);color:#fff;border-radius:28px;padding:22px 18px 18px;margin-bottom:12px}
.hero label{color:rgba(255,255,255,.7);text-align:center}
#time{color:#fff;background:transparent;text-align:center;font-size:76px;font-weight:700;letter-spacing:-2px;line-height:1;padding:2px 0 14px;caret-color:#fff}
::placeholder{color:rgba(255,255,255,.3);opacity:1}
#what::placeholder{color:var(--mute);opacity:.7}
.sep{height:1px;background:rgba(255,255,255,.18);margin:0 -4px 16px}
.drow{display:flex;gap:10px;align-items:flex-end}
.drow>div:first-child{flex:1.1}
#date{background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:13px 14px;font-size:18px;font-weight:600;text-align:center;border:2px solid transparent}
#date:focus,#time:focus{border-color:rgba(255,255,255,.55)}
#time:focus{border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:11px 16px;cursor:pointer;transition:background .15s,color .15s}
.chip.on{background:#fff;color:var(--blue)}
.chip:active{transform:scale(.97)}
.quick{margin-top:14px}
.quick .chip{padding:9px 14px;font-size:13px;background:transparent;border:1.5px solid rgba(255,255,255,.3)}
.add{width:100%;margin-top:18px;font:inherit;font-size:17px;font-weight:700;color:var(--blue);background:#fff;border:0;border-radius:16px;padding:17px;cursor:pointer;transition:transform .1s}
.add:active{transform:scale(.98)}
.err{min-height:20px;margin:10px 2px 0;font-size:13.5px;color:var(--err);text-align:center}
h2{font-size:14px;margin:26px 4px 10px;color:var(--mute);font-weight:600}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:8px}
.when{min-width:66px;text-align:center}
.when b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--blue);line-height:1.1}
.when small{font-size:12px;color:var(--mute)}
.body{flex:1;min-width:0}
.body b{display:block;font-weight:600;word-break:break-word}
.body small{color:var(--mute);font-size:13px}
.del{font:inherit;font-size:13px;font-weight:600;color:var(--blue);background:var(--sky);border:0;border-radius:12px;padding:9px 12px;cursor:pointer}
.item.due{background:var(--blue);color:#fff}
.item.due .when b,.item.due .body small,.item.due .when small{color:#fff}
.item.due .body small{opacity:.85}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:6px;animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.item.done{background:transparent;padding:8px 16px;margin-bottom:2px}
.item.done .when b{font-size:16px;color:var(--mute)}
.item.done .body b{text-decoration:line-through;color:var(--mute);font-weight:400}
.item.done .body small{color:var(--ok)}
.empty{text-align:center;padding:26px 10px;color:var(--mute);font-size:14px}
.empty svg{display:block;margin:0 auto 10px}
.clr{width:100%;font:inherit;font-size:13px;font-weight:600;color:var(--mute);background:transparent;border:0;padding:12px;cursor:pointer}
.banner{background:var(--sky);border-radius:20px;padding:16px;margin-bottom:12px;font-size:14px}
.banner button{margin-top:10px;font:inherit;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.hint{font-size:12.5px;color:var(--mute);text-align:center;margin-top:22px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-size:14px;font-weight:600;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
</style></head><body><main>
<div class="top"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg></div><h1>Remind me</h1></div>
<div id="perm"></div>

<div class="card">
  <label for="what">Co ci przypomnieć?</label>
  <input id="what" maxlength="120" placeholder="np. Wziąć tabletki" autocomplete="off">
</div>

<section class="hero">
  <label for="time">Godzina</label>
  <input id="time" inputmode="numeric" placeholder="--:--" autocomplete="off" aria-label="Godzina, np. 14:30">
  <div class="sep"></div>
  <div class="drow">
    <div><label for="date" style="text-align:left">Data</label><input id="date" inputmode="numeric" placeholder="DD.MM.RRRR" autocomplete="off"></div>
    <div class="chips"><button class="chip" data-d="0">Dziś</button><button class="chip" data-d="1">Jutro</button></div>
  </div>
  <div class="chips quick"><button class="chip" data-m="15">za 15 min</button><button class="chip" data-m="60">za 1 godz.</button><button class="chip" data-m="180">za 3 godz.</button></div>
  <button class="add" id="add">Dodaj przypomnienie</button>
  <div class="err" id="err" role="alert"></div>
</section>

<div id="list"></div>
<p class="hint">iPhone: Udostępnij → Do ekranu początkowego, potem otwórz aplikację stamtąd.</p>
</main>
<div class="toast" id="toast"></div>
<script>
const ST='kv',$=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('remindme',1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){const d=await idb();return new Promise(res=>{const q=d.transaction(ST).objectStore(ST).get('list');q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
async function save(l){const d=await idb();return new Promise(res=>{const t=d.transaction(ST,'readwrite');t.objectStore(ST).put(l,'list');t.oncomplete=res})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dstr=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const tstr=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
function dayLabel(t){const n=new Date(),d=new Date(t),diff=Math.round((day0(d)-day0(n))/864e5);
  if(diff===0)return 'Dziś';if(diff===1)return 'Jutro';
  return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'})}
function rel(at){const m=Math.round((at-Date.now())/60000);
  if(m<1)return 'za chwilę';if(m<60)return `za ${m} min`;
  if(m<1440){const h=Math.floor(m/60),r=m%60;return `za ${h} godz.`+(r?` ${r} min`:'')}
  return dayLabel(at)}
// --- wpisywanie z palca ---
$('#time').addEventListener('input',e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,4);let o=v;
  if(v.length===3)o=(+v.slice(0,2)<=23?v.slice(0,2)+':'+v.slice(2):v[0]+':'+v.slice(1));
  if(v.length===4)o=v.slice(0,2)+':'+v.slice(2);
  e.target.value=o;
});
$('#time').addEventListener('blur',e=>{const v=e.target.value;if(/^\d{1,2}$/.test(v))e.target.value=v+':00'});
$('#date').addEventListener('input',e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,8);let o=v.slice(0,2);
  if(v.length>2)o+='.'+v.slice(2,4);if(v.length>4)o+='.'+v.slice(4);
  e.target.value=o;chips();
});
function parseTime(s){const m=s.match(/^(\d{1,2})(?::(\d{1,2}))?$/);if(!m)return null;const h=+m[1],mi=m[2]===undefined?0:+m[2];return h<24&&mi<60?[h,mi]:null}
function parseDate(s){const m=s.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?$/);if(!m)return null;
  const n=new Date();let y=m[3]?+m[3]:n.getFullYear();const d=+m[1],mo=+m[2];
  const chk=(yy)=>{const t=new Date(yy,mo-1,d);return t.getDate()===d&&t.getMonth()===mo-1?t:null};
  let t=chk(y);if(t&&!m[3]&&day0(t)<day0(n))t=chk(y+1);return t}
function chips(){const v=$('#date').value;
  document.querySelectorAll('[data-d]').forEach(b=>{const d=new Date();d.setDate(d.getDate()+ +b.dataset.d);b.classList.toggle('on',v===dstr(d))})}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=new Date();d.setDate(d.getDate()+ +b.dataset.d);$('#date').value=dstr(d);chips();$('#err').textContent=''});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const d=new Date(Date.now()+ +b.dataset.m*60000);$('#date').value=dstr(d);$('#time').value=tstr(d);chips();$('#err').textContent=''});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
$('#add').onclick=async()=>{
  const err=m=>{$('#err').textContent=m},text=$('#what').value.trim();
  if(!text)return err('Wpisz, co ci przypomnieć.');
  const tm=parseTime($('#time').value.trim());if(!tm)return err('Wpisz godzinę, np. 1430 albo 8:15.');
  const dt=parseDate($('#date').value.trim());if(!dt)return err('Wpisz datę, np. 1210 albo 12.10.2026.');
  dt.setHours(tm[0],tm[1],0,0);const at=dt.getTime();
  if(at<=Date.now())return err('Ta godzina już minęła. Wybierz późniejszą.');
  if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();
  const l=await load();l.push({id:crypto.randomUUID(),text,at,done:false});await save(l);
  err('');$('#what').value='';$('#time').value='';$('#date').value=dstr(new Date());chips();
  toast(`Ustawione: ${dayLabel(at).toLowerCase()}, ${tstr(dt)}`);perm();render();tick();
};
function perm(){
  if(!('Notification' in window)){$('#perm').innerHTML='<div class="banner">Ta przeglądarka nie obsługuje powiadomień. Na iPhonie dodaj aplikację do ekranu początkowego.</div>';return}
  if(Notification.permission==='granted'){$('#perm').innerHTML='';return}
  $('#perm').innerHTML='<div class="banner">Żeby przypomnienia dochodziły, włącz powiadomienia.<br><button id="allow">Włącz powiadomienia</button></div>';
  $('#allow').onclick=async()=>{await Notification.requestPermission();perm()};
}
const bell='<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0"/></svg>';
async function render(){
  const l=(await load()).sort((a,b)=>a.at-b.at),now=Date.now();
  const act=l.filter(r=>!r.done),dn=l.filter(r=>r.done).sort((a,b)=>b.doneAt-a.doneAt);
  let h='<h2>Zaplanowane</h2>';
  h+=act.length?act.map(r=>{const due=r.at<=now,d=new Date(r.at);
    return `<div class="item ${due?'due':''}"><div class="when"><b>${tstr(d)}</b><small>${dayLabel(r.at)}</small></div><div class="body"><b>${esc(r.text)}</b><small>${due?'<span class="dot"></span>Odhacz w powiadomieniu':rel(r.at)}</small></div>${due?'':`<button class="del" data-del="${r.id}">Usuń</button>`}</div>`}).join('')
  :`<div class="empty">${bell}Nic nie czeka. Dodaj pierwsze przypomnienie.</div>`;
  if(dn.length)h+='<h2>Zrobione</h2>'+dn.slice(0,8).map(r=>`<div class="item done"><div class="when"><b>${tstr(new Date(r.at))}</b></div><div class="body"><b>${esc(r.text)}</b><small>Zrobione ${tstr(new Date(r.doneAt))}</small></div></div>`).join('')+'<button class="clr" id="clr">Wyczyść historię</button>';
  $('#list').innerHTML=h;
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await save((await load()).filter(r=>r.id!==b.dataset.del));render()});
  const c=$('#clr');if(c)c.onclick=async()=>{await save((await load()).filter(r=>!r.done));render()};
}
const tick=()=>{if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'check'});render()};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(async r=>{await navigator.serviceWorker.ready;try{await r.periodicSync.register('check',{minInterval:60000})}catch(e){}});
  navigator.serviceWorker.addEventListener('message',render);
}
$('#date').value=dstr(new Date());chips();perm();render();setInterval(tick,5000);
document.addEventListener('visibilitychange',tick);
</script></body></html>
